[package]
name = "postscript"
version = "0.1.0"
edition = "2024"
authors = ["ningchen"]
description = "A native PostScript interpreter, DSC parser, and 2D vector renderer in pure Rust"

[dependencies]
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.8"
thiserror = "2.0"

[lib]
name = "postscript"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "psview"
path = "src/main.rs"

[dev-dependencies]
